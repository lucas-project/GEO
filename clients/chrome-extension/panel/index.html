<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEO AI OS</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3l3 6 6 1-4.5 4.5L18 21l-6-3-6 3 1.5-6.5L3 10l6-1 3-6z" />
        </svg>
        <span>GEO AI OS</span>
      </div>
      <a href="#" id="open-options" class="link">Settings</a>
    </header>

    <main>
      <section id="page-info">
        <div class="label">Current page</div>
        <div id="page-url" class="url">—</div>
      </section>

      <button id="run-audit" class="primary">Analyze this page for AI visibility</button>

      <section id="status" class="status hidden"></section>

      <section id="result" class="hidden">
        <div class="score-row">
          <div class="score-gauge">
            <svg viewBox="0 0 100 100" width="80" height="80">
              <circle cx="50" cy="50" r="44" fill="none" stroke="#26262e" stroke-width="8" />
              <circle id="gauge-arc" cx="50" cy="50" r="44" fill="none" stroke="#7c5cff" stroke-width="8"
                      stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="276"
                      transform="rotate(-90 50 50)" />
            </svg>
            <div id="score-text" class="score-text">—</div>
          </div>
          <div class="score-meta">
            <div class="caption">Overall GEO score</div>
            <div id="score-label" class="label-large">—</div>
          </div>
        </div>

        <section>
          <div class="caption">Dimensions</div>
          <div id="dimensions" class="dimensions"></div>
        </section>

        <section>
          <div class="caption">Top issues</div>
          <div id="issues" class="issues"></div>
        </section>

        <section>
          <div class="caption">Recommended fixes</div>
          <div id="fixes" class="fixes"></div>
        </section>

        <a id="open-full-report" href="#" target="_blank" class="link-button">Open full report →</a>
      </section>
    </main>

    <script src="panel.js" type="module"></script>
  </body>
</html>
